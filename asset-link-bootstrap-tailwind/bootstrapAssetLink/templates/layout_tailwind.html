<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> {% block pageTitle %} Bootstrap Home | Tailwind {% endblock %}</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>

<body>

  <nav
    class="flex items-center justify-between px-6 md:px-16 lg:px-24 xl:px-32 py-4 border-b border-gray-300 bg-white relative transition-all">
    <a href="">
      <img class="h-9"
        src="https://raw.githubusercontent.com/prebuiltui/prebuiltui/main/assets/dummyLogo/dummyLogoColored.svg"
        alt="dummyLogoColored">
    </a>

    <button aria-label="Menu" id="menu-toggle" class="sm:hidden">
      <svg width="21" height="15" viewBox="0 0 21 15" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="21" height="1.5" rx=".75" fill="#426287" />
        <rect x="8" y="6" width="13" height="1.5" rx=".75" fill="#426287" />
        <rect x="6" y="13" width="15" height="1.5" rx=".75" fill="#426287" />
      </svg>
    </button>

    <div id="mobile-menu"
      class="hidden absolute top-[60px] left-0 w-full bg-white shadow-md py-4 flex-col items-start gap-2 px-5 text-sm md:hidden">
      <a href="#" class="block">Home</a>
      <a href="#" class="block">About</a>
      <a href="#" class="block">Contact</a>
      <button
        class="cursor-pointer px-6 py-2 mt-2 bg-indigo-500 hover:bg-indigo-600 transition text-white rounded-full text-sm">
        Login
      </button>
    </div>

    <div class="hidden sm:flex items-center gap-8">
      <a href="{% url 'index' %}">Home</a>
      <a href="{% url 'index_pip' %}">Home PIP</a>
      <a href="{% url 'index_tailwind' %}">Home Tailwind</a>
      <a href="{% url 'about' %}">About</a>
      <a href="{% url 'contact' %}">Contact</a>

      
    </div>
  </nav>

  <script>
    document.getElementById("menu-toggle").addEventListener("click", function () {
      const menu = document.getElementById("mobile-menu");
      if (menu.classList.contains("hidden")) {
        menu.classList.remove("hidden");
        menu.classList.add("flex");
      } else {
        menu.classList.add("hidden");
      }
    });
  </script>


  {% block content %}{% endblock %}

</body>

</html>
