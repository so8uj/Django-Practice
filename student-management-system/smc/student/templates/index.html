{% extends 'layout.html' %}

{% block title %} Student Management System {% endblock %}

{% block content %}
<div class="container">


    <div class="d-flex justify-content-between align-items-center pt-5 mb-3">
        <h3>Welcome to the Student Management System</h3>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#studentManagementModal">Add Student</button>
    </div>
    <div class="card">
        <div class="card-body">

            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Name</th>
                        <th scope="col">Roll</th>
                        <th scope="col">Email</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="studentManagementModal" tabindex="-1" aria-labelledby="studentManagementModal" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="studentManagementModal">Modal title</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                ...
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary">Save changes</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}
