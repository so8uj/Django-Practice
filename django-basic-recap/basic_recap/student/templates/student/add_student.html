{% extends "layout.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex align-items-center justify-content-between pb-5">
        <h1>Add Student</h1>
        <a href="{% url 'student:index' %}">Manage Students</a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags  }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {% include 'student/stdent_form.html' %}

        <button class="btn theme-primary" type="submit">Add Student</button>

    </form>
    

</div>
{% endblock %}
