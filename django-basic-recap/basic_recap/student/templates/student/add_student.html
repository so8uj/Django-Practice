{% extends "layout.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex align-items-center justify-content-between pb-5">
        <h1>Add Student</h1>
        <a href="{% url 'student:index' %}">Manage Students</a>
    </div>

    {% include 'messages.html' %}

    <form method="POST">
        {% csrf_token %}
        {% include 'student/stdent_form.html' %}

        <button class="btn-subtle theme-primary" type="submit">Add Student</button>

    </form>
    

</div>
{% endblock %}
