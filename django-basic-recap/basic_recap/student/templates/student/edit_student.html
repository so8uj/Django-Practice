{% extends "layout.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex align-items-center justify-content-between pb-5">
        <h1>Edit Student</h1>
        <div>
            <a href="{% url 'student:add_student' %}">Add Student</a> |
            <a href="{% url 'student:index' %}">Manage Students</a>
        </div>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags  }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {% include 'student/stdent_form.html' %}
        <button class="btn-subtle theme-warning" type="submit">Update Student</button>
    </form>
    

</div>
{% endblock %}
